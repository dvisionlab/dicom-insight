[project]
name = "dicom-insight"
version = "1.1.0"
description = "Human-readable DICOM metadata explorer for developers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "D/Vision Lab" }]

dependencies = [
  "pydicom>=2.4",
  "numpy>=1.24",
  "rich>=13.0",
  "httpx>=0.20.0",
  "tabulate>=0.9.0",
]

[project.scripts]
dicom-insight = "dicom_insight.cli:main"

[dependency-groups]
dev = [
  "pyinstaller>=6.0",
  "pytest>=9.0.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["dicom_insight"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
addopts = "--cov=dicom_insight --cov-report=term-missing"
testpaths = ["tests"]
